defaults:
  - ppo_trainer
  - _self_

data:
  gen_batch_size: ${data.train_batch_size}
  return_raw_chat: True
  filter_overlong_prompts: True
  truncation: left

reward_model:
  reward_manager: episode

actor_rollout_ref:
  rollout:
    n: 1

traj_collector:
  custom_cls:
    path: recipe/denoise_v2/collector.py
    name: DenoiseTrajectoryCollector

env:
  env_name: alfworld/AlfredTWEnv
  max_steps: 50
  history_length: 4
  rollout:
    # Mathematical v2 analogue: 16 rollouts share one active gamefile/rho.
    n: 16
  denoise:
    enable: True
    mode: online
    # Fresh-gamefile curriculum: every step consumes a new shuffled pool batch;
    # rho is shared and updated across gamefiles of the same task type.
    v2:
      enabled: True
      initial_rho: 0.0
      min_rho: 0.0
      max_rho: 0.5
      target_accuracy: 0.75
      alpha: 0.2
      shuffle_seed: ${env.seed}
    main_rollout_n: 0
    sub_rollout_k: 16
    # mixed: clean and denoise rollouts share one GRPO advantage group.
    # split: clean and denoise rollouts use separate advantage groups.
    advantage_grouping: mixed
    # Legacy offline replay mode. Only used when env.denoise.mode=prefix_pool.
    prefix_pool_path: null
    min_prefix_steps: 1
    max_prefix_steps: 6
    prefix_seed: ${env.seed}
    require_failed_prefixes: True
    online:
      model_path: null
      prefix_strategy: full_then_ratio
      prefix_ratio: 0.3
      prefix_candidates_per_group: 1
      prefix_sample_seed: ${env.seed}
      full_rollout_max_steps: ${env.max_steps}
      avoid_terminal_prefix: True
      # Optional cap on the replayed prefix length. Leave null for pure ratio truncation.
      max_prefix_steps: null
      prompt_length: ${data.max_prompt_length}
      response_length: 512
      temperature: 1.0
      top_p: 1.0
      top_k: -1
      do_sample: True
      tensor_model_parallel_size: ${actor_rollout_ref.rollout.tensor_model_parallel_size}
      max_model_len: ${actor_rollout_ref.rollout.max_model_len}
      max_num_batched_tokens: ${actor_rollout_ref.rollout.max_num_batched_tokens}
      # vLLM memory fractions for the two colocated rollout engines.
      denoiser_gpu_memory_utilization: 0.2
      solver_gpu_memory_utilization: 0.5
      # Legacy shared mode: when the explicit values above are null, the denoiser
      # uses this value and the solver uses min(2x, cap).
      shared_gpu_memory_utilization: null
      colocate_gpu_util_cap: 0.9
      # Keep the two vLLM sleep-mode engines on the same GPU pool but in separate
      # Ray processes. vLLM sleep mode allows only one engine instance per process.
      separate_denoise_process: True

algorithm:
  adv_estimator: grpo
  filter_groups:
    enable: False
    max_num_gen_batches: 10

trainer:
  project_name: alfworld-denoise
